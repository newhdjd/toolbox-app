plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toolbox.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.toolbox.app"
        minSdk 21          // 支持 Android 5.0+（覆盖 99%+ 用户）
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 核心只用 WebView，不需要额外依赖
}
